# ============================================================
# PR test verification pipeline
#
# Trigger conditions:
#   1. PR commits (open / synchronize / reopened)
#   2. Files under tests/ are changed in the PR
#
# Workflow:
#   1. Check changed files under tests/ in the PR
#   2. Compute VM spec from test metadata of changed scripts
#      (QEMU count, CPU, memory, NICs, disks, server_count)
#   3. Request env from persistent CI pre-provisioned pool (pool A=1q×20 / pool B=2q×5)
#   4. Execute changed scripts in QEMU simulating manual test flow
#   5. Release env back to pool (no VM deletion, mark as idle for reuse)
#
# Note: No PR comment is posted. For fork PRs, GITHUB_TOKEN is read-only
#   and custom secrets are not passed to fork PRs, causing 403 on comment API.
#   Results are shown as workflow log / check run.
#
# Runner: self-hosted (10.20.238.253, openruyi-github-runner)
# ============================================================
name: PR Tests Changed Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-tests-changed:
    # Only run when PR changes tests/ directory
    if: ${{ github.event.pull_request }}
    runs-on: [self-hosted, Linux, X64, openEuler]
    timeout-minutes: 600
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WORKSPACE: ${{ github.workspace }}
      CLOUDPODS_KEYSTONE_URL: ${{ secrets.CLOUDPODS_KEYSTONE_URL }}
      CLOUDPODS_USER: ${{ secrets.CLOUDPODS_USER }}
      CLOUDPODS_PASSWORD: ${{ secrets.CLOUDPODS_PASSWORD }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      # --------------------------------------------------------
      # Step 0: Ensure paramiko on runner (idempotent)
      # --------------------------------------------------------
      - name: Ensure paramiko on runner
        run: |
          python3 -c "import paramiko" 2>/dev/null || \
            python3 -m pip install --user paramiko 2>&1 | tail -3

      # --------------------------------------------------------
      # Step 1: Collect only PR-changed test.sh files
      # --------------------------------------------------------
      - name: Get PR-changed test files
        id: changed
        run: |
          # Use git diff between PR base and head to find only changed files
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | grep '^tests/functional/pkgs/' \
            | grep '/test\.sh$' \
            | sort > changed_files.txt || true

          echo "PR-changed test files:"
          cat changed_files.txt
          COUNT=$(wc -l < changed_files.txt)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "No test files changed in PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------------
      # Step 2: Compute VM resource spec
      # --------------------------------------------------------
      - name: Compute VM requirements
        id: compute
        if: steps.changed.outputs.changed == 'true'
        run: |
          python3 .github/scripts/cli.py compute-requirements \
            --repo "$GITHUB_WORKSPACE" \
            --changed-files changed_files.txt \
            --output vm_requirements.json
          cat vm_requirements.json

      # --------------------------------------------------------
      # Step 3: Acquire env from CI pre-provisioned pool
      # --------------------------------------------------------
      - name: Acquire environment from CI pool
        id: pool-acquire
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -o pipefail
          python3 .github/scripts/cli.py pool-acquire \
            --requirements vm_requirements.json \
            --timeout 600 \
            --output vm_info.json 2>&1 | tee pool_acquire.log
          echo "vm_info:"
          cat vm_info.json
        env:
          CLOUDPODS_KEYSTONE_URL: ${{ secrets.CLOUDPODS_KEYSTONE_URL }}
          CLOUDPODS_USER: ${{ secrets.CLOUDPODS_USER }}
          CLOUDPODS_PASSWORD: ${{ secrets.CLOUDPODS_PASSWORD }}

      # --------------------------------------------------------
      # Step 4: Execute changed test scripts in QEMU
      # --------------------------------------------------------
      - name: Run tests in QEMU (simulate manual testing)
        id: run-tests
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -o pipefail
          python3 .github/scripts/cli.py run-tests-in-qemu \
            --vm-info vm_info.json \
            --repo "$GITHUB_WORKSPACE" \
            --requirements vm_requirements.json \
            --output test_results.json 2>&1 | tee run_tests.log
          echo "test_results:"
          cat test_results.json || true

      # --------------------------------------------------------
      # Step 5: Release env back to pool (no VM delete, always runs)
      # --------------------------------------------------------
      - name: Release environment back to pool
        if: always()
        run: |
          if [ -f vm_info.json ]; then
            python3 .github/scripts/cli.py pool-release --pool-info vm_info.json || true
          else
            echo "No vm_info.json, skip release"
          fi
        env:
          CLOUDPODS_KEYSTONE_URL: ${{ secrets.CLOUDPODS_KEYSTONE_URL }}
          CLOUDPODS_USER: ${{ secrets.CLOUDPODS_USER }}
          CLOUDPODS_PASSWORD: ${{ secrets.CLOUDPODS_PASSWORD }}
