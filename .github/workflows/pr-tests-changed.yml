# ============================================================
# PR 测试验证流水线
#
# 触发条件：
#   1. 有 PR 提交（open / synchronize / reopened）
#   2. PR 中 tests/ 目录下有文件改动
#
# 流程：
#   1. 检查 PR 中 tests/ 下改动的文件
#   2. 根据改动脚本涉及的测试元数据计算 VM 规格
#      （QEMU 数量、CPU、内存、网卡、磁盘、server_count）
#   3. 从持久化 CI 预置池中申请环境（池A=1q×20 / 池B=2q×5）
#   4. 在 QEMU 中模拟手工测试方式执行被修改的脚本
#   5. 释放环境回池（不删除 VM）
#
# 注意：不发布 PR 评论。fork 仓库提交的 PR 中 GITHUB_TOKEN 为只读，
#   且自定义 secrets 不传递给 fork PR，调用评论 API 会 403 失败。
#   结果以 workflow 日志 / check run 形式呈现。
#
# Runner: self-hosted (10.20.238.253, openruyi-github-runner)
# ============================================================
name: PR Tests Changed Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-tests-changed:
    # 仅在 PR 改动 tests/ 目录时运行
    if: ${{ github.event.pull_request }}
    runs-on: [self-hosted, Linux, X64, openEuler]
    timeout-minutes: 600
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WORKSPACE: ${{ github.workspace }}
      CLOUDPODS_KEYSTONE_URL: ${{ secrets.CLOUDPODS_KEYSTONE_URL }}
      CLOUDPODS_USER: ${{ secrets.CLOUDPODS_USER }}
      CLOUDPODS_PASSWORD: ${{ secrets.CLOUDPODS_PASSWORD }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      # --------------------------------------------------------
      # 步骤 0：确保 runner 上有 paramiko（幂等）
      # --------------------------------------------------------
      - name: Ensure paramiko on runner
        run: |
          python3 -c "import paramiko" 2>/dev/null || \
            python3 -m pip install --user paramiko 2>&1 | tail -3

      # --------------------------------------------------------
      # 步骤 1：收集 tests/ 下改动的文件
      # --------------------------------------------------------
      - name: Get changed files under tests/
        id: changed
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- tests/ > changed_files.txt || true
          echo "Changed files under tests/:"
          cat changed_files.txt
          COUNT=$(wc -l < changed_files.txt)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          # 无改动时输出空，供后续步骤短路
          if [ "$COUNT" -eq 0 ]; then
            echo "No tests/ changes in this PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------------
      # 步骤 2：计算 VM 资源规格
      # --------------------------------------------------------
      - name: Compute VM requirements
        id: compute
        if: steps.changed.outputs.changed == 'true'
        run: |
          python3 .github/scripts/cli.py compute-requirements \
            --repo "$GITHUB_WORKSPACE" \
            --changed-files changed_files.txt \
            --output vm_requirements.json
          cat vm_requirements.json

      # --------------------------------------------------------
      # 步骤 3：从 CI 预置池中申请环境
      # --------------------------------------------------------
      - name: Acquire environment from CI pool
        id: pool-acquire
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -o pipefail
          python3 .github/scripts/cli.py pool-acquire \
            --requirements vm_requirements.json \
            --timeout 600 \
            --output vm_info.json 2>&1 | tee pool_acquire.log
          echo "vm_info:"
          cat vm_info.json
        env:
          CLOUDPODS_KEYSTONE_URL: ${{ secrets.CLOUDPODS_KEYSTONE_URL }}
          CLOUDPODS_USER: ${{ secrets.CLOUDPODS_USER }}
          CLOUDPODS_PASSWORD: ${{ secrets.CLOUDPODS_PASSWORD }}

      # --------------------------------------------------------
      # 步骤 4：在 QEMU 中执行被修改的测试脚本
      # --------------------------------------------------------
      - name: Run tests in QEMU (simulate manual testing)
        id: run-tests
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -o pipefail
          python3 .github/scripts/cli.py run-tests-in-qemu \
            --vm-info vm_info.json \
            --repo "$GITHUB_WORKSPACE" \
            --requirements vm_requirements.json \
            --output test_results.json 2>&1 | tee run_tests.log
          echo "test_results:"
          cat test_results.json || true

      # --------------------------------------------------------
      # 步骤 5：释放环境回池（不删除 VM，总是执行）
      # --------------------------------------------------------
      - name: Release environment back to pool
        if: always()
        run: |
          if [ -f vm_info.json ]; then
            python3 .github/scripts/cli.py pool-release --pool-info vm_info.json || true
          else
            echo "No vm_info.json, skip release"
          fi
        env:
          CLOUDPODS_KEYSTONE_URL: ${{ secrets.CLOUDPODS_KEYSTONE_URL }}
          CLOUDPODS_USER: ${{ secrets.CLOUDPODS_USER }}
          CLOUDPODS_PASSWORD: ${{ secrets.CLOUDPODS_PASSWORD }}
